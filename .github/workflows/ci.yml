name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# The workflow's token can only read the repo: no job here needs to write.
permissions:
  contents: read

# Each job stops after 15 minutes. Without a limit GitHub waits 6 hours,
# so a stuck step (like a stalled apt download) holds up merges all day.
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest

  model-service:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: model-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # A single static ffmpeg file from PyPI, instead of apt: the runner's
      # Ubuntu mirror often stalls partway through apt's 99-package download.
      - name: Install ffmpeg
        timeout-minutes: 5
        run: |
          pip install imageio-ffmpeg==0.6.0
          echo "FFMPEG_BINARY=$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest

  ml-liveness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ml/liveness
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Some dev dependencies need Node 22 or newer.
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  # Known vulnerabilities in our dependencies. Fails on any finding not in
  # .github/pip-audit-accepted.txt (each accepted one has its reason there).
  # A new advisory can turn this red on a PR that didn't change anything:
  # upgrade the package, or accept it there with a reason (docs/runbook.md).
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install pip-audit
        run: pip install pip-audit==2.10.1
      - name: Python dependencies
        run: |
          ignores=$(grep -oE '^[A-Za-z]+-[A-Za-z0-9-]+' .github/pip-audit-accepted.txt | sed 's/^/--ignore-vuln /' | tr '\n' ' ')
          rc=0
          for dir in backend model-service ml/liveness; do
            echo "::group::$dir"
            pip-audit --progress-spinner off -r "$dir/requirements.txt" $ignores || rc=1
            echo "::endgroup::"
          done
          echo "::group::backend (dev tools)"
          pip-audit --progress-spinner off -r backend/requirements-dev.txt $ignores || rc=1
          echo "::endgroup::"
          exit $rc
      - name: Frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high
