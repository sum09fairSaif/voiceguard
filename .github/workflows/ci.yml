name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# The workflow's token can only read the repo: no job here needs to write.
# Actions are pinned to a full commit (tags can be moved); the comment says
# which release that commit is.
permissions:
  contents: read

# Each job stops after 15 minutes. Without a limit GitHub waits 6 hours,
# so a stuck step (like a stalled apt download) holds up merges all day.
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest

  model-service:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: model-service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      # A single static ffmpeg file from PyPI, instead of apt: the runner's
      # Ubuntu mirror often stalls partway through apt's 99-package download.
      - name: Install ffmpeg
        timeout-minutes: 5
        run: |
          pip install imageio-ffmpeg==0.6.0
          echo "FFMPEG_BINARY=$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest

  ml-liveness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ml/liveness
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Some dev dependencies need Node 22 or newer.
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  # Known vulnerabilities in our dependencies. Fails on any finding not in
  # .github/pip-audit-accepted.txt (each accepted one has its reason there).
  # A new advisory can turn this red on a PR that didn't change anything:
  # upgrade the package, or accept it there with a reason (docs/runbook.md).
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install pip-audit
        run: pip install pip-audit==2.10.1
      - name: Python dependencies
        run: |
          # Every requirements file in the repo, each with only the findings
          # accepted for its own folder.
          rc=0
          for file in $(git ls-files '*requirements*.txt' | sort); do
            folder=$(dirname "$file")
            ignores=$(awk -v f="$folder" '$1 !~ /^#/ && $2 == f {printf "--ignore-vuln %s ", $1}' .github/pip-audit-accepted.txt)
            echo "::group::$file"
            pip-audit --progress-spinner off -r "$file" $ignores || rc=1
            echo "::endgroup::"
          done
          exit $rc
      - name: Frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high
