name: Uptime

# Checks the live API, asking for every 5 minutes (GitHub's shortest schedule).
# In practice GitHub runs it only every few hours, so it's the backup: the
# alert to rely on is UptimeRobot, every 5 minutes (docs/runbook.md, #167).
# Opens an "API is down" issue after two failed tries, so everyone watching
# the repo is notified, and closes it when the API answers again.
# Scheduled runs only start once this file is on the default branch (main).
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# One check at a time: a slow one never overlaps the next.
concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the API
        env:
          API_URL: https://api.get-voiceguard.tech
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/check_uptime.py
