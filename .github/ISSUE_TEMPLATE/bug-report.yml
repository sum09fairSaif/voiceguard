name: Bug report
description: Something doesn't work the way it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, including any error message.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should have happened
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      multiple: true
      options:
        - Live site (Vercel / Render)
        - Running locally
        - CI
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: e.g. Chrome 140 on Windows, Safari on iPhone
  - type: markdown
    attributes:
      value: |
        **Please don't attach voice recordings, passwords, tokens or `.env` values.** Describe the recording instead (length, browser, quiet or noisy room).
